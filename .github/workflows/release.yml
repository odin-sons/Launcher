name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish again, e.g. v2.3.0
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Tag must match the project version
        id: version
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v', ''
          $line = Select-String -Path Launcher.Avalonia/Launcher.Avalonia.csproj -Pattern '<Version>(.*)</Version>' | Select-Object -First 1
          $declared = $line.Matches[0].Groups[1].Value
          if ($declared -ne $version) {
            Write-Error "Tag $env:TAG does not match <Version>$declared</Version> in Launcher.Avalonia.csproj"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

  test:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: |
          dotnet restore Launcher.Tests/Launcher.Tests.csproj
          dotnet restore Indexer.Tests/Indexer.Tests.csproj

      - name: Build
        run: |
          dotnet build Launcher.Tests/Launcher.Tests.csproj --no-restore --configuration Release
          dotnet build Indexer.Tests/Indexer.Tests.csproj --no-restore --configuration Release

      - name: Test — Launcher.Core
        run: dotnet test Launcher.Tests/Launcher.Tests.csproj --no-build --configuration Release

      - name: Test — Indexer
        run: dotnet test Indexer.Tests/Indexer.Tests.csproj --no-build --configuration Release

  build-windows:
    needs: [check, test]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build
        shell: pwsh
        run: ./Launcher.Avalonia/build-windows/build-windows.ps1

      - name: Name the asset
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Copy-Item Launcher.Avalonia/dist/OdinsonsLauncher.exe "assets/OdinsonsLauncher-$env:VERSION-win-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: assets/*
          if-no-files-found: error

  build-macos:
    needs: [check, test]
    strategy:
      matrix:
        arch: [arm64, x64]

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build and zip
        env:
          VERSION: ${{ needs.check.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir assets
          bash ./Launcher.Avalonia/build-macos.sh --arch "$ARCH"
          ditto -c -k --keepParent Launcher.Avalonia/dist/OdinsonsLauncher.app "assets/OdinsonsLauncher-$VERSION-macos-$ARCH.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: assets/*
          if-no-files-found: error

  release:
    needs: [check, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            found
          ' CHANGELOG.md > body.md

          if ! grep -q '[^[:space:]]' body.md; then
            echo "::error::CHANGELOG.md has no entry for $VERSION"
            exit 1
          fi

          {
            cat body.md
            echo
            echo "## Downloads"
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| Windows (x64) | \`OdinsonsLauncher-$VERSION-win-x64.exe\` |"
            echo "| macOS, Apple Silicon | \`OdinsonsLauncher-$VERSION-macos-arm64.zip\` |"
            echo "| macOS, Intel | \`OdinsonsLauncher-$VERSION-macos-x64.zip\` |"
            echo
            echo "The builds are not code-signed. Windows SmartScreen asks for \"More info\" → \"Run anyway\" on the first run; on macOS open the app with right-click → Open the first time. Checksums are in \`SHA256SUMS.txt\`."
          } > notes.md

      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          title="Odinsons Launcher $VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file notes.md
            gh release upload "$TAG" assets/* --clobber
          else
            flags=()
            [[ "$TAG" == *-* ]] && flags+=(--prerelease)
            gh release create "$TAG" assets/* --verify-tag --title "$title" --notes-file notes.md "${flags[@]}"
          fi
