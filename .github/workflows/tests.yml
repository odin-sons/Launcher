name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # Launcher.Tests и Indexer.Tests оба тянут Launcher.Core как ProjectReference,
      # поэтому одного restore на каждый тестовый проект достаточно — build/test
      # сам подтягивает зависимости по цепочке.
      - name: Restore
        run: |
          dotnet restore Launcher.Tests/Launcher.Tests.csproj
          dotnet restore Indexer.Tests/Indexer.Tests.csproj

      - name: Build
        run: |
          dotnet build Launcher.Tests/Launcher.Tests.csproj --no-restore --configuration Release
          dotnet build Indexer.Tests/Indexer.Tests.csproj --no-restore --configuration Release

      - name: Test — Launcher.Core (FileDownloader, UpdateSession, ...)
        run: dotnet test Launcher.Tests/Launcher.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Test — Indexer (rule matching, manifest classification)
        run: dotnet test Indexer.Tests/Indexer.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"
